[project]
name = "certificate"
version = "0.1.0"
description = "Model certification pipeline (AISI inspect): plain evals, perturbation auditing, agentic simulation"
requires-python = ">=3.12"
dependencies = [
    # eval stack — inspect-ai >= 0.3.246 required: its OpenRouter provider
    # retries keep-alive/non-JSON bodies (JSONDecodeError) that older
    # versions (e.g. 0.3.69) let crash entire tasks. Exact versions of
    # everything (including transitives) are pinned by uv.lock — keep it
    # committed, and upgrade deliberately via `uv lock --upgrade-package X`.
    "inspect-ai==0.3.246",
    "openai>=2.45.0",
    "anthropic>=0.116.0",
    # models / inference — the adversarial-attack extras (litellm[proxy],
    # vllm) live on the adversarial-attacks branch, not here
    "torch>=2.4.0",
    "transformers>=5",
    "huggingface-hub",
    # analysis / plotting
    "requests",
    "tqdm",
    "pandas>=3",
    "numpy>=2",
    "scipy",
    "matplotlib",
    "seaborn",
    "geopandas",
    "ipython",
    "dirtyjson",
]

[tool.uv]
# this repo is a script collection, not an installable package
package = false
