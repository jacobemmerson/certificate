# Legal-group leaves: the relevance anchors for sub-sampling.
#
# PROVISIONAL, written 2026-10-09 from the Code of Practice, Safety & Security
# chapter, Appendix 1.3 (sources of systemic risk) and 1.4 (specified systemic
# risks). The annotators own the exemplars and the per-source leaf assignment
# (`Source.leaf` in sources/*.py); edit both here and there.
#
# legal_text is the CoP wording (PDF line-break hyphenation repaired). Where the
# item is a bare phrase it is prefixed with its list's lead-in and followed by
# the 1.4 definition of the specified risk it belongs to.
# exemplars are the "Input to model" part of a sample item in annotations.csv,
# taken only where that benchmark unambiguously instantiates the leaf; the
# comment above each list names the benchmarks. Empty = for the annotators.

